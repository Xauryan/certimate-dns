services:
  certimate:
    build:
      context: ..
    image: certimate-dns:local
    pull_policy: build
    container_name: certimate
    environment:
      - CERTIMATE_ADMIN_USERNAME
      - CERTIMATE_ADMIN_PASSWORD
    ports:
      - 8090:8090
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./data:/app/pb_data
    restart: unless-stopped
