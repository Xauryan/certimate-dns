name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test Certimate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '0'
      GOFLAGS: '-trimpath'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build embedded web UI
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          node --test ui/src/pages/dnsbatch/files.test.mjs tests/ui/*.test.mjs
          test -s ui/dist/index.html
      - name: Test DNS management in Chrome with a local provider fixture
        run: |
          npm --prefix tests/browser ci --ignore-scripts
          npm --prefix tests/browser test
      - name: Build Linux binary
        run: go build -mod=readonly -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/certimate" .
      - name: Cross-build Windows IIS binding helper
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -mod=readonly -o "$RUNNER_TEMP/certimate-iis-bind.exe" ./cmd/certimate-iis-bind
      - name: Test and build the Rust DDNS agent for Linux and Windows
        working-directory: cmd/ddns-agent-native
        run: |
          if ! command -v x86_64-w64-mingw32-gcc >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          fi
          rustup target add x86_64-pc-windows-gnu
          cargo test --locked
          cargo build --locked --release
          cargo build --locked --release --target x86_64-pc-windows-gnu
      - name: Check the native Linux agent's systemd units
        run: |
          units="$RUNNER_TEMP/ddns-units"
          mkdir -p "$units"
          agent="$PWD/cmd/ddns-agent-native/target/release/certimate-ddns-agent"
          sed "s|/usr/local/bin/certimate-ddns-agent-native|$agent|" \
            deploy/systemd/certimate-ddns-agent-native.service > "$units/certimate-ddns-agent-native.service"
          cp deploy/systemd/certimate-ddns-agent-native.timer "$units/"
          systemd-analyze verify --man=no "$units"/certimate-ddns-agent-native.{service,timer}
      - name: Run offline Go tests
        shell: bash
        run: |
          # Live vendor suites live under providers-tester and use external accounts.
          mapfile -t packages < <(git ls-files 'pkg/*_test.go' | grep -v '/providers-tester/' | sed 's|/[^/]*$||; s|^|./|' | sort -u)
          go test -mod=readonly ./cmd ./cmd/dnsmgr-migrate ./internal/... "${packages[@]}"
      - name: Exercise v0.4.38 database upgrade, grants, DNS CRUD and restart
        run: python3 tests/integration/acceptance.py --binary "$RUNNER_TEMP/certimate"
      - name: Exercise DDNS reporting and provider writes over loopback
        run: |
          python3 tests/integration/ddns_acceptance.py --binary "$RUNNER_TEMP/certimate" \
            --agent cmd/ddns-agent-native/target/release/certimate-ddns-agent
      - name: Check first start with an empty database
        shell: bash
        run: |
          "$RUNNER_TEMP/certimate" serve --dir "$RUNNER_TEMP/ci-pb-data" --http 127.0.0.1:18090 > "$RUNNER_TEMP/ci-serve.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --silent --show-error --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:18090/api/health | jq -e '.code == 200'
          curl --silent --show-error --fail http://127.0.0.1:18090/ | cmp - ui/dist/index.html
          for method in GET POST PATCH DELETE; do
            endpoint=http://127.0.0.1:18090/api/dns/cloudflare/test/zones/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/records
            if [[ "$method" == PATCH || "$method" == DELETE ]]; then endpoint="$endpoint/bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"; fi
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' -X "$method" "$endpoint")
            [[ "$status" == 401 || "$status" == 403 ]]
          done


  container:
    name: Build and start the documented source image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build using the Compose recipe
        run: docker compose -f docker/docker-compose.yml build certimate
      - name: Check the image entrypoint with disposable data
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/image-pb-data"
          export CERTIMATE_ADMIN_PASSWORD="$(openssl rand -hex 24)"
          docker run --detach --name certimate-image-check \
            --publish 127.0.0.1:18091:8090 \
            --mount "type=bind,source=$RUNNER_TEMP/image-pb-data,target=/app/pb_data" \
            --env CERTIMATE_ADMIN_USERNAME=ci@example.test --env CERTIMATE_ADMIN_PASSWORD certimate-dns:local
          trap 'docker stop certimate-image-check >/dev/null' EXIT
          # Docker can accept and reset connections while PocketBase runs migrations.
          curl --silent --show-error --fail --retry 25 --retry-all-errors --retry-delay 1 \
            --max-time 4 --retry-max-time 45 --output "$RUNNER_TEMP/image-health.json" \
            http://127.0.0.1:18091/api/health
          jq -e '.code == 200' "$RUNNER_TEMP/image-health.json"
          curl --silent --show-error --fail http://127.0.0.1:18091/ | grep -iq '<!doctype html'
          test -s "$RUNNER_TEMP/image-pb-data/data.db"
